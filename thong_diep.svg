<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
<style>
text{fill:white;font:40px sans-serif;text-anchor:middle}
.bg{fill:#111}
.fade{animation:move 8s linear infinite}
.fade2{animation:move 8s linear infinite 4s}
@keyframes move{
0%,10%{opacity:0;transform:translateY(0)}
15%,40%{opacity:1;transform:translateY(0)}
65%{opacity:0;transform:translateY(180px)}
100%{opacity:0;transform:translateY(180px)}
}
</style>
<rect class="bg" width="100%" height="100%"/>
<g class="fade">
<text x="360" y="500">I love you</text>
<text x="360" y="560">Vợ của anh nha</text>
<text x="360" y="620">Hồng Phương</text>
<text x="360" y="680">Nay là ngày đầu tiên</text>
</g>
<g class="fade2">
<text x="360" y="500">Bước qua tháng 8</text>
<text x="360" y="560">Chúc vợ may mắn</text>
<text x="360" y="620">Trong tháng này nha! ❤</text>
<text x="360" y="680">Yêu em nhiều lắm! 💕</text>
</g>
</svg>