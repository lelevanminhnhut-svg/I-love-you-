<!doctype html><html><head><meta charset=utf-8><style>
body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
#t{color:#fff;font:48px Arial;text-align:center;position:relative}
</style></head><body><div id=t></div><script>
const msgs=["I love you","Vợ của anh nha","Hồng Phương","Nay là ngày đầu tiên","Bước qua tháng 8","Chúc vợ may mắn","Trong tháng này nha! ❤","Yêu em nhiều lắm! 💕"];
let i=0,t=document.getElementById('t');
function show(){t.style.transition='none';t.style.opacity=1;t.style.transform='translateY(0)';t.innerHTML=msgs[i];
setTimeout(()=>{t.style.transition='all 2s';t.style.opacity=0;t.style.transform='translateY(200px)';},2000);
setTimeout(()=>{i=(i+1)%msgs.length;show();},4000);}
show();
</script></body></html>
